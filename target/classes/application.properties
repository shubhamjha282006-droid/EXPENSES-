# ===================================================================
# SMART EXPENSE TRACKER - APPLICATION CONFIGURATION
# ===================================================================

# Application Name & Port
spring.application.name=smart-expense-tracker
server.port=8081

# -------------------------------------------------------------------
# MySQL Database Configuration
# NOTE: Update username and password according to your local MySQL setup.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_expense_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# 'update' automatically updates table schemas while preserving existing data
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Static Resource Mapping (Serves Frontend from /static/)
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Session Configuration (Session lasts 30 minutes of inactivity)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=EXPENSE_TRACKER_SESSIONID
